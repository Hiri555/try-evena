<!doctype html>
<meta charset="utf-8">
<title>Rendu SS7 ép.1</title>
<style>html,body{margin:0;background:#EDE4D2;overflow:hidden}canvas{display:block}</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="gsap.min.js"></script>
<script src="lib.js"></script>
<script src="lib2.js"></script>
<script src="ss7.js"></script>
<script src="chapters.js"></script>
<script>
gsap.ticker.lagSmoothing(0); gsap.ticker.sleep();
const cv = document.getElementById('c');
const g  = cv.getContext('2d', { alpha: false });
g.textBaseline = 'alphabetic';
const FPS = 24;

CHAPTERS.forEach(ch => {
  ch.frames = Math.round(ch.dur * FPS);
  ch.S = {}; ch.tl = gsap.timeline({ paused: true }); ch.setup(ch.tl, ch.S);
});
const TOTAL = CHAPTERS.reduce((a, c) => a + c.frames, 0);

async function loadFonts() {
  const defs = [
    ['Archivo','archivo-latin-700-normal.woff2',700],['Archivo','archivo-latin-600-normal.woff2',600],
    ['Caveat','caveat-latin-700-normal.woff2',700],  ['Caveat','caveat-latin-600-normal.woff2',600],
    ['Plex','PlexSans-Regular.woff2',400],['Plex','PlexSans-Medium.woff2',500],
    ['Plex','PlexSans-SemiBold.woff2',600],
    ['PlexMono','PlexMono-Regular.woff2',400],['PlexMono','PlexMono-Medium.woff2',500],
    ['Saira','SairaCondensed-Bold.woff2',700],['Saira','SairaCondensed-SemiBold.woff2',600],
  ];
  for (const [fam, file, wt] of defs) {
    const f = new FontFace(fam, `url(/fonts/${file})`, { weight: String(wt) });
    await f.load(); document.fonts.add(f);
  }
  await document.fonts.ready;
}

let img = null, key = '';
async function getImg(src) {
  if (src === key) return img;
  try {
    const i = new Image(); i.src = src; await i.decode();
    img = i; key = src; return i;
  } catch (e) { key = src; img = null; return null; }   // plate absente : on continue sans
}

window.__ready = false;
(async () => { await loadFonts(); buildTextures(); window.__ready = true; })();

window.renderFrame = async function (gf) {
  let acc = 0, idx = 0, local = 0;
  for (let i = 0; i < CHAPTERS.length; i++) {
    if (gf < acc + CHAPTERS[i].frames) { idx = i; local = gf - acc; break; }
    acc += CHAPTERS[i].frames; idx = i; local = CHAPTERS[i].frames - 1;
  }
  const ch = CHAPTERS[idx];
  const t = local / FPS;
  _frameIdx = gf;

  let pl = null;
  if (ch.bl) {
    const span = ch.bl.to - ch.bl.from;
    const n = Math.round(clamp((t - ch.bl.from) / span) * (ch.bl.count - 1)) + 1;
    if (t >= ch.bl.from - 1.6 && t <= ch.bl.to + 1.6)
      pl = await getImg(`/ss7/bl2/${ch.bl.dir}/${String(Math.max(1, Math.min(n, ch.bl.count))).padStart(4,'0')}.jpg`);
  }

  ch.tl.pause(t);

  g.setTransform(SCALE,0,0,SCALE,0,0);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.setLineDash([]); g.letterSpacing = '0px'; g.textAlign = 'left';
  g.fillStyle = '#EDE4D2'; g.fillRect(0, 0, W, H);

  // le bureau sur lequel les feuilles glissent
  g.fillStyle = '#C9BCA2'; g.fillRect(0, 0, W, H);

  // caméra du chapitre + respiration + la feuille qui entre / qui sort
  const c = ch.S.cam || { z: 1, x: 0, y: 0, rot: 0 };
  const d = derive(gf);
  const TR = 0.38;
  const inE  = 1 - Math.pow(1 - Math.min(t / TR, 1), 3);       // arrivée vive
  const outQ = ch.S.out ? ch.S.out.o : 0;                      // départ accéléré
  const dx   = W * 0.66 * (1 - inE) - W * 0.74 * outQ;
  const rot  = 0.034 * (1 - inE) - 0.030 * outQ;
  const slip = 1 - 0.045 * (1 - inE) - 0.035 * outQ;
  g.save();
  g.translate(W / 2 + c.x + d.x + dx, H / 2 + c.y + d.y);
  g.rotate((c.rot || 0) + d.rot + rot);
  const z = (c.z || 1) * d.z * slip;
  g.scale(z, z);
  g.translate(-W / 2, -H / 2);
  if (Math.abs(dx) > 1) {                                      // ombre portée pendant le glissement
    g.save();
    g.shadowColor = 'rgba(52,38,16,.42)'; g.shadowBlur = 46;
    g.shadowOffsetX = dx > 0 ? -22 : 22;
    g.fillStyle = C.papier;
    g.fillRect(-W * 0.05, -H * 0.05, W * 1.10, H * 1.10);
    g.restore();
  }
  ch.draw(g, ch.S, t, pl);
  g.restore();

  // le grain et la vignette restent fixes : ils appartiennent à l'image, pas à la page
  paper(g, .09); grain(g, _frameIdx, .7); vignette(g, .5);
  return idx;
};
window.setBlCounts = (m) => { CHAPTERS.forEach(c => { if (c.bl && m[c.bl.dir]) c.bl.count = m[c.bl.dir]; }); };
window.totalFrames = () => TOTAL;
window.grab = (q) => cv.toDataURL('image/jpeg', q || 0.94);
</script>
