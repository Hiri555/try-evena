<!-- ══════════════════════════════════════════════════════════════
     Rosalia — Order Status page (MD17 §2)

     WHERE THIS GOES
     Shopify admin → Settings → Checkout → Order status page →
     "Additional scripts" textarea.

     READ THIS FIRST
     Since the checkout extensibility migration, many shops no longer
     have an "Additional scripts" box — it was removed and replaced by
     the Checkout and accounts editor, which only accepts app blocks.
       • If you SEE the box: paste everything below into it.
       • If you DON'T see it: this file can't be used. Use
         checkout/custom-pixel-purchase.js instead for the tracking
         (Settings → Customer events → Add custom pixel), and skip the
         "what to expect" and survey blocks — they need an app.

     The survey card stays dormant until you replace TALLY_FORM_ID with a
     real form ID, so nothing broken ever ships to a customer.
     ══════════════════════════════════════════════════════════════ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --ros-cream: #FAF5F0;
    --ros-beige: #F5EFEA;
    --ros-plum: #7A3A54;
    --ros-wine: #4B1528;
    --ros-pink: #C4718E;
    --ros-pink-light: #F7E4EA;
    --ros-dark: #1F1A1C;
    --ros-gray: #6E6367;
    --ros-serif: 'Cormorant Garamond', Georgia, serif;
    --ros-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  /* ── What to expect ─────────────────────────────────── */
  .rosalia-next-steps {
    margin: 32px 0;
    padding: 26px 24px;
    background: var(--ros-cream);
    border: 1px solid var(--ros-pink-light);
    border-radius: 10px;
  }
  .rosalia-next-steps h3 {
    font-family: var(--ros-serif);
    font-style: italic;
    font-weight: 500;
    font-size: 23px;
    line-height: 1.2;
    color: var(--ros-plum);
    margin: 0 0 18px;
  }
  .rosalia-steps-list { display: flex; flex-direction: column; gap: 13px; }
  .rosalia-step {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    font-family: var(--ros-sans);
    font-size: 14px;
    line-height: 1.5;
    color: var(--ros-dark);
  }
  .rosalia-step-num {
    flex: 0 0 24px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--ros-pink-light);
    color: var(--ros-plum);
    font-weight: 600;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
  }
  .rosalia-step strong { font-weight: 600; }

  /* ── Survey card ────────────────────────────────────── */
  .rosalia-survey-card {
    margin: 24px 0;
    padding: 28px 24px;
    background: var(--ros-cream);
    border: 1px solid var(--ros-pink-light);
    border-radius: 10px;
    text-align: center;
  }
  .rosalia-survey-card-eyebrow {
    font-family: var(--ros-sans);
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ros-pink);
    font-weight: 600;
    margin-bottom: 12px;
  }
  .rosalia-survey-card-heading {
    font-family: var(--ros-serif);
    font-size: 25px;
    font-weight: 600;
    color: var(--ros-dark);
    line-height: 1.15;
    margin-bottom: 10px;
  }
  .rosalia-survey-card-heading em { font-style: italic; color: var(--ros-plum); }
  .rosalia-survey-card-sub {
    font-family: var(--ros-serif);
    font-style: italic;
    font-size: 16px;
    color: var(--ros-gray);
    line-height: 1.45;
    margin-bottom: 22px;
  }
  .rosalia-survey-cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 30px;
    background: var(--ros-plum);
    color: var(--ros-cream);
    text-decoration: none;
    border-radius: 100px;
    font-family: var(--ros-sans);
    font-size: 12px;
    letter-spacing: .06em;
    text-transform: uppercase;
    font-weight: 600;
    transition: background .3s ease;
  }
  .rosalia-survey-cta:hover { background: var(--ros-wine); }
</style>

<script>
  (function () {
    var anchor = document.querySelector('.os-step__info') || document.querySelector('.main__header');
    if (!anchor || !anchor.parentNode) return;

    var steps = document.createElement('div');
    steps.className = 'rosalia-next-steps';
    steps.innerHTML =
      '<h3>What to expect over the next 8 weeks.</h3>' +
      '<div class="rosalia-steps-list">' +
        '<div class="rosalia-step"><div class="rosalia-step-num">1</div><div><strong>Week 1&ndash;2 &mdash; the quiet.</strong> Skin stops stinging. The barrier begins to rebuild. Nothing dramatic &mdash; that&rsquo;s the point.</div></div>' +
        '<div class="rosalia-step"><div class="rosalia-step-num">2</div><div><strong>Week 3&ndash;4 &mdash; the first shift.</strong> Baseline redness softens. Flushing episodes get shorter. Skin feels less reactive.</div></div>' +
        '<div class="rosalia-step"><div class="rosalia-step-num">3</div><div><strong>Week 5&ndash;6 &mdash; others notice.</strong> Tone evens out. Foundation coverage drops.</div></div>' +
        '<div class="rosalia-step"><div class="rosalia-step-num">4</div><div><strong>Week 7&ndash;8 &mdash; the new baseline.</strong> Your skin settles into its new normal and the flare cycle shortens.</div></div>' +
      '</div>';

    anchor.parentNode.insertBefore(steps, anchor.nextSibling);
  })();
</script>

<script>
  (function () {
    /* Replace TALLY_FORM_ID with the real form ID to switch this card on.
       Until then it stays hidden rather than shipping a dead link. */
    var formId = 'TALLY_FORM_ID';
    if (formId === 'TALLY_' + 'FORM_ID') return;

    var params = new URLSearchParams({
      order_id: {{ order.order_number | json }},
      customer_email: {{ order.email | json }},
      order_total: {{ order.total_price | money_without_currency | json }},
      variant: {{ order.line_items.first.variant.title | json }}
    });

    var anchor = document.querySelector('.os-step__info') || document.querySelector('main');
    if (!anchor) return;

    var card = document.createElement('div');
    card.className = 'rosalia-survey-card';
    card.innerHTML =
      '<div class="rosalia-survey-card-eyebrow">One last thing</div>' +
      '<div class="rosalia-survey-card-heading"><em>60 seconds</em> that shape what we make next.</div>' +
      '<div class="rosalia-survey-card-sub">Four questions. No sales pitch. Your honest words decide the next bottle.</div>' +
      '<a href="https://tally.so/r/' + formId + '?' + params.toString() + '" target="_blank" rel="noopener" class="rosalia-survey-cta">Share your thoughts <span aria-hidden="true">&rarr;</span></a>';

    anchor.insertBefore(card, anchor.firstChild);
  })();
</script>

<script>
  (function () {
    /* Meta CAPI fires server-side through the Facebook & Instagram channel,
       so this only covers what that channel does not send. */
    var orderValue = {{ order.total_price | divided_by: 100.0 | json }};
    var orderId = {{ order.order_number | json }};
    var variant = {{ order.line_items.first.variant.title | json }};

    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({
      event: 'purchase',
      ecommerce: {
        transaction_id: orderId,
        value: orderValue,
        currency: 'USD',
        items: [{
          item_name: 'Daily Reset Serum',
          item_variant: variant,
          price: orderValue,
          quantity: 1
        }]
      }
    });

    if (typeof ttq !== 'undefined') {
      ttq.track('Purchase', { value: orderValue, currency: 'USD', content_id: 'daily-reset-serum' });
    }

    if (typeof klaviyo !== 'undefined') {
      klaviyo.push(['track', 'Order Placed', {
        order_id: orderId,
        total_price: orderValue,
        variant: variant
      }]);
    }
  })();
</script>
