<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>SF03 · Blocking</title>
<link rel="stylesheet" href="/engine/tokens.css">
</head>
<body>
<!-- SF03 · S08.1 · instant : « Le câble existe toujours. STP a simplement retiré ce chemin de la topologie active. » -->
<div class="stage">
  <svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
  <div class="subtitle">Le câble existe <em>toujours</em>. STP a simplement retiré ce chemin de la topologie active.</div>
</div>
<script type="module">
import * as K from '/engine/components.js';
const { C } = K;
const GOLD = '#F5B83D';
document.documentElement.style.setProperty('--subtitle-accent', C.error);
const AI = '/COURSE_02_STP/06-assets/ai';

const sw1 = K.switchDevice({ x: 835, y: 200, w: 250, h: 150, label: 'SW1', highlight: GOLD, ports: { bottom: [{ name: 'Fa0/1', led: 'blue' }, { name: 'Gi0/2', led: 'blue' }] } });
const sw2 = K.switchDevice({ x: 380, y: 640, w: 250, h: 150, label: 'SW2', sub: 'coût root : 8', ports: { top: [{ name: 'Fa0/1', led: 'red' }], right: [{ name: 'Gi0/2', led: 'green' }] } });
const sw3 = K.switchDevice({ x: 1290, y: 640, w: 250, h: 150, label: 'SW3', sub: 'coût root : 4', ports: { top: [{ name: 'Gi0/1', led: 'green' }], left: [{ name: 'Gi0/2', led: 'blue' }] } });
const a = (sw, p) => sw.port(p);

let svg = K.defs();
svg += `<defs><radialGradient id="cf" cx="0.5" cy="0.5" r="0.5"><stop offset="0.45" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
  <mask id="cm"><rect x="840" y="20" width="240" height="160" fill="url(#cf)"/></mask></defs>`;
svg += `<text x="960" y="600" text-anchor="middle" font-family="${C.ui}" font-weight="800" font-size="240" letter-spacing="14" fill="none" stroke="${C.error}" stroke-opacity="0.12" stroke-width="3">BLOQUÉ</text>`;
// active topology (the tree) glows; the blocked link stays visible but dashed
svg += K.cable(a(sw1, 'Gi0/2'), a(sw3, 'Gi0/1'), { color: C.forward, width: 7, glow: true });
svg += K.cable(a(sw2, 'Gi0/2'), a(sw3, 'Gi0/2'), { color: C.forward, width: 7, glow: true });
const p1 = a(sw1, 'Fa0/1'), p2 = a(sw2, 'Fa0/1');
svg += `<path d="M${p1.x} ${p1.y} L${p2.x} ${p2.y}" stroke="${C.muted}" stroke-width="6" stroke-dasharray="14 12" opacity="0.8"/>`;
// link labels
const mid = (u, v, dx = 0, dy = 0) => ({ x: (u.x + v.x) / 2 + dx, y: (u.y + v.y) / 2 + dy });
const lab = (m, speed, cost, col) => K.pill(m.x, m.y, `${speed} · coût ${cost}`, { color: col, size: 17 });
svg += lab(mid(p1, p2, -230, -110), '100 Mb/s', 19, C.muted);
svg += lab(mid(a(sw1, 'Gi0/2'), a(sw3, 'Gi0/1'), 120, -10), '1 Gb/s', 4, C.decision);
svg += lab(mid(a(sw2, 'Gi0/2'), a(sw3, 'Gi0/2'), 0, -36), '1 Gb/s', 4, C.decision);
svg += sw1.svg + sw2.svg + sw3.svg;
// crown on the root
svg += `<image href="${AI}/crown.jpg" x="840" y="20" width="240" height="160" preserveAspectRatio="xMidYMid slice" mask="url(#cm)"/>`;
svg += K.pill(1210, 230, 'ROOT BRIDGE', { color: GOLD, size: 20, filled: true });
// the barrier on the SW2 side of the slow link
svg += K.barrier(p2, p1, { at: 0.22, len: 150 });
// BPDU still arriving at the blocked port (it listens)
const bp = { x: p1.x + (p2.x - p1.x) * 0.52, y: p1.y + (p2.y - p1.y) * 0.52 };
svg += K.frame({ x: bp.x, y: bp.y, s: 0.55, compact: true, color: C.control }).svg;
svg += K.text(bp.x + 70, bp.y + 8, 'BPDU', { size: 15, weight: 800, fill: C.control, anchor: 'start', ls: 2 });
svg += K.pill(bp.x + 70, bp.y + 44, 'écoute les BPDU · ne transmet pas', { color: C.control, size: 15, anchor: 'start' });
// role badges
svg += K.roleBadge(a(sw1, 'Fa0/1'), 'DP', { dx: -70, dy: 20 });
svg += K.roleBadge(a(sw1, 'Gi0/2'), 'DP', { dx: 70, dy: 20 });
svg += K.roleBadge(a(sw3, 'Gi0/1'), 'RP', { dx: 70, dy: -20 });
svg += K.roleBadge(a(sw3, 'Gi0/2'), 'DP', { dx: -10, dy: 60 });
svg += K.roleBadge(a(sw2, 'Gi0/2'), 'RP', { dx: 10, dy: 60 });
svg += K.roleBadge(a(sw2, 'Fa0/1'), 'ALT', { dx: -80, dy: -20, s: 1.15 });
// legend
const lg = [['RP', 'Root Port · meilleur chemin vers le root', C.forward], ['DP', 'Designated · 1 par câble', C.traffic], ['ALT', 'Bloqué / Alternate · en veille', C.error]];
svg += `<g filter="url(#shadow)"><rect x="1450" y="60" width="420" height="190" rx="18" fill="#0C1427" fill-opacity="0.94" stroke="${C.deviceEdge}" stroke-width="2"/></g>`;
lg.forEach(([r, d, c], i) => {
  svg += `<rect x="1474" y="${88 + i * 52}" width="58" height="30" rx="7" fill="${c}"/>` + K.text(1503, 109 + i * 52, r, { size: 16, weight: 800, fill: '#08101E' });
  svg += K.text(1548, 109 + i * 52, d, { size: 17, weight: 600, fill: C.text, anchor: 'start' });
});
svg += K.text(60, 58, '04 · LE BLOCAGE', { size: 17, weight: 700, font: C.mono, fill: C.muted, anchor: 'start', ls: 3 });

document.getElementById('s').innerHTML = svg;
await document.fonts.ready;
await new Promise((r) => { const im = new Image(); im.onload = im.onerror = r; im.src = `${AI}/crown.jpg`; });
window.__ready = true;
</script>
</body>
</html>
